[package]
name = "conciliador"
version = "1.0.0"
description = "Conciliacao automatica de extratos bancarios (desktop, offline-first)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rust_decimal = "1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "2"
regex = "1"
urlencoding = "2"
tiny_http = "0.12"

# Armazenamento seguro de segredos: no Windows usa o Credential Manager (DPAPI,
# criptografia por-usuario do SO, sem senha-mestra). Encapsula a Win32 de forma
# testada — mais seguro que chamar CredWriteW cru.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

# HTTP para o motor de IA (sempre) e OAuth Google (feature google).
# rustls-tls evita dependencia de OpenSSL do sistema no Windows.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

# Escrita local via COM automation do Excel (plano A, Windows-only).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[features]
default = []

[lib]
name = "conciliador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
